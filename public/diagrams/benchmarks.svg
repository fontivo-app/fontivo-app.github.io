<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif" role="img" aria-labelledby="benchTitle benchDesc">
  <title id="benchTitle">Fontivo Performance Benchmarks</title>
  <desc id="benchDesc">Comparison bar charts measuring Fontivo v1.0.0 against traditional font managers: Activation latency for 1,000 fonts via Win32 AddFontResourceExW FR_PRIVATE (0.4 ms) and idle resident RAM footprint (~38.5 MB). Shorter bars are better.</desc>

  <defs>
    <radialGradient id="benchBg" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#291C2E"/>
      <stop offset="65%" stop-color="#1D1322"/>
      <stop offset="100%" stop-color="#140D17"/>
    </radialGradient>
    <linearGradient id="coralBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F16B50"/>
      <stop offset="100%" stop-color="#D9573D"/>
    </linearGradient>
    <linearGradient id="lavenderBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B7A1D9"/>
      <stop offset="100%" stop-color="#8F77B5"/>
    </linearGradient>
    <linearGradient id="plumBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4A3554"/>
      <stop offset="100%" stop-color="#6A5078"/>
    </linearGradient>
    <linearGradient id="glassCardBench" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF9F2" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#B7A1D9" stop-opacity="0.02"/>
    </linearGradient>
    <pattern id="benchDots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFF9F2" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <style>
    <![CDATA[
    .mono {
      font-family: 'JetBrains Mono', 'Segoe UI Mono', Consolas, monospace;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      animate { display: none !important; }
    }
    ]]>
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="620" rx="28" fill="url(#benchBg)"/>
  <rect width="1200" height="620" rx="28" fill="url(#benchDots)"/>
  <rect x="1" y="1" width="1198" height="618" rx="27" fill="none" stroke="#FFF9F2" stroke-opacity="0.1" stroke-width="1.5"/>

  <!-- HEADER -->
  <g transform="translate(48, 52)">
    <g transform="translate(0, -26) scale(0.072)">
      <path fill="#F16B50" d="M86 177c0-67 49-116 116-116h211c14 0 22 15 14 27l-43 66H204c-31 0-53 16-69 44l-49 85z"/>
      <path fill="#B7A1D9" d="M76 350c0-67 49-116 116-116h177c14 0 22 15 14 27l-43 66H194c-31 0-53 16-69 44l-49 85z"/>
    </g>

    <text x="48" y="0" font-size="26" font-weight="800" letter-spacing="-0.4" fill="#FFF9F2">
      Fontivo Stays Lightweight &amp; Instant as Libraries Scale
    </text>
    <text x="48" y="26" font-size="14" fill="#F5EBDD" fill-opacity="0.78">
      Activation speed &amp; idle RAM footprint across 10,939 fonts / 4,430 families. Shorter bars are better.
    </text>

    <g transform="translate(916, -14)">
      <rect width="188" height="32" rx="16" fill="#291C2E" stroke="#F16B50" stroke-opacity="0.5" stroke-width="1.2"/>
      <circle cx="18" cy="16" r="4" fill="#F16B50">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="32" y="20" font-size="11.5" font-weight="700" fill="#FFF9F2">Benchmark Suite v1.0.0</text>
    </g>
  </g>

  <!-- PANEL 1 (LEFT): ACTIVATION LATENCY (1,000 FONTS) -->
  <g transform="translate(48, 108)">
    <rect width="536" height="476" rx="20" fill="url(#glassCardBench)" stroke="#46324E" stroke-width="1.2"/>

    <g transform="translate(26, 34)">
      <text x="0" y="0" font-size="17" font-weight="800" fill="#FFF9F2">Activation Latency (1,000 Fonts)</text>
      <text x="0" y="21" font-size="12.5" fill="#B7A1D9">Time to register fonts in Windows GDI / DirectWrite</text>
    </g>

    <!-- Row 1: Fontivo -->
    <g transform="translate(0, 86)">
      <text x="158" y="21" text-anchor="end" font-size="13" font-weight="700" fill="#FFF9F2">Fontivo (Win32)</text>
      <rect x="172" y="6" width="170" height="22" rx="11" fill="#FFF9F2" fill-opacity="0.06"/>
      <rect x="172" y="6" width="16" height="22" rx="11" fill="url(#coralBar)">
        <animate attributeName="width" from="0" to="16" dur="0.7s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/>
      </rect>
      <text x="356" y="21" font-size="12.5" font-weight="700" fill="#F16B50">
        0.4 ms <tspan font-weight="500" fill="#B7A1D9">(baseline)</tspan>
      </text>
    </g>

    <!-- Row 2: Typeface -->
    <g transform="translate(0, 146)">
      <text x="158" y="21" text-anchor="end" font-size="13" font-weight="500" fill="#B7A1D9">Typeface</text>
      <rect x="172" y="6" width="170" height="22" rx="11" fill="#FFF9F2" fill-opacity="0.06"/>
      <rect x="172" y="6" width="54" height="22" rx="11" fill="url(#plumBar)">
        <animate attributeName="width" from="0" to="54" dur="0.8s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/>
      </rect>
      <text x="356" y="21" font-size="12.5" font-weight="700" fill="#F5EBDD">
        480 ms <tspan font-weight="500" fill="#9D8CA8">(1,200x)</tspan>
      </text>
    </g>

    <!-- Row 3: NexusFont -->
    <g transform="translate(0, 206)">
      <text x="158" y="21" text-anchor="end" font-size="13" font-weight="500" fill="#B7A1D9">NexusFont</text>
      <rect x="172" y="6" width="170" height="22" rx="11" fill="#FFF9F2" fill-opacity="0.06"/>
      <rect x="172" y="6" width="88" height="22" rx="11" fill="url(#plumBar)">
        <animate attributeName="width" from="0" to="88" dur="0.9s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/>
      </rect>
      <text x="356" y="21" font-size="12.5" font-weight="700" fill="#F5EBDD">
        1,250 ms <tspan font-weight="500" fill="#9D8CA8">(3,125x)</tspan>
      </text>
    </g>

    <!-- Row 4: Suitcase Fusion -->
    <g transform="translate(0, 266)">
      <text x="158" y="21" text-anchor="end" font-size="13" font-weight="500" fill="#B7A1D9">Suitcase Fusion</text>
      <rect x="172" y="6" width="170" height="22" rx="11" fill="#FFF9F2" fill-opacity="0.06"/>
      <rect x="172" y="6" width="120" height="22" rx="11" fill="url(#plumBar)">
        <animate attributeName="width" from="0" to="120" dur="1.0s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/>
      </rect>
      <text x="356" y="21" font-size="12.5" font-weight="700" fill="#F5EBDD">
        2,800 ms <tspan font-weight="500" fill="#9D8CA8">(7,000x)</tspan>
      </text>
    </g>

    <!-- Row 5: FontBase -->
    <g transform="translate(0, 326)">
      <text x="158" y="21" text-anchor="end" font-size="13" font-weight="500" fill="#B7A1D9">FontBase</text>
      <rect x="172" y="6" width="170" height="22" rx="11" fill="#FFF9F2" fill-opacity="0.06"/>
      <rect x="172" y="6" width="142" height="22" rx="11" fill="url(#plumBar)">
        <animate attributeName="width" from="0" to="142" dur="1.1s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/>
      </rect>
      <text x="356" y="21" font-size="12.5" font-weight="700" fill="#F5EBDD">
        3,400 ms <tspan font-weight="500" fill="#9D8CA8">(8,500x)</tspan>
      </text>
    </g>

    <!-- Row 6: Windows Default -->
    <g transform="translate(0, 386)">
      <text x="158" y="21" text-anchor="end" font-size="13" font-weight="500" fill="#B7A1D9">Windows Default</text>
      <rect x="172" y="6" width="170" height="22" rx="11" fill="#FFF9F2" fill-opacity="0.06"/>
      <rect x="172" y="6" width="170" height="22" rx="11" fill="url(#plumBar)">
        <animate attributeName="width" from="0" to="170" dur="1.2s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/>
      </rect>
      <text x="356" y="21" font-size="12.5" font-weight="700" fill="#F5EBDD">
        5,600 ms <tspan font-weight="500" fill="#9D8CA8">(14,000x)</tspan>
      </text>
    </g>

    <text x="26" y="454" font-size="10.5" fill="#9D8CA8" class="mono">
      * Win32 AddFontResourceExW (FR_PRIVATE) avoids copying files to C:\Windows\Fonts
    </text>
  </g>

  <!-- PANEL 2 (RIGHT): IDLE RESIDENT RAM FOOTPRINT -->
  <g transform="translate(616, 108)">
    <rect width="536" height="476" rx="20" fill="url(#glassCardBench)" stroke="#46324E" stroke-width="1.2"/>

    <g transform="translate(26, 34)">
      <text x="0" y="0" font-size="17" font-weight="800" fill="#FFF9F2">Idle Memory Footprint (RAM)</text>
      <text x="0" y="21" font-size="12.5" fill="#B7A1D9">Resident Set Size (RSS) in background tray mode</text>
    </g>

    <!-- Row 1: Fontivo -->
    <g transform="translate(0, 86)">
      <text x="158" y="21" text-anchor="end" font-size="13" font-weight="700" fill="#FFF9F2">Fontivo (Rust)</text>
      <rect x="172" y="6" width="170" height="22" rx="11" fill="#FFF9F2" fill-opacity="0.06"/>
      <rect x="172" y="6" width="18" height="22" rx="11" fill="url(#lavenderBar)">
        <animate attributeName="width" from="0" to="18" dur="0.7s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/>
      </rect>
      <text x="356" y="21" font-size="12.5" font-weight="700" fill="#B7A1D9">
        ~38.5 MB <tspan font-weight="500" fill="#F16B50">(baseline)</tspan>
      </text>
    </g>

    <!-- Row 2: NexusFont -->
    <g transform="translate(0, 146)">
      <text x="158" y="21" text-anchor="end" font-size="13" font-weight="500" fill="#B7A1D9">NexusFont</text>
      <rect x="172" y="6" width="170" height="22" rx="11" fill="#FFF9F2" fill-opacity="0.06"/>
      <rect x="172" y="6" width="42" height="22" rx="11" fill="url(#plumBar)">
        <animate attributeName="width" from="0" to="42" dur="0.8s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/>
      </rect>
      <text x="356" y="21" font-size="12.5" font-weight="700" fill="#F5EBDD">
        118.0 MB <tspan font-weight="500" fill="#9D8CA8">(3.1x)</tspan>
      </text>
    </g>

    <!-- Row 3: Typeface -->
    <g transform="translate(0, 206)">
      <text x="158" y="21" text-anchor="end" font-size="13" font-weight="500" fill="#B7A1D9">Typeface</text>
      <rect x="172" y="6" width="170" height="22" rx="11" fill="#FFF9F2" fill-opacity="0.06"/>
      <rect x="172" y="6" width="58" height="22" rx="11" fill="url(#plumBar)">
        <animate attributeName="width" from="0" to="58" dur="0.9s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/>
      </rect>
      <text x="356" y="21" font-size="12.5" font-weight="700" fill="#F5EBDD">
        165.2 MB <tspan font-weight="500" fill="#9D8CA8">(4.3x)</tspan>
      </text>
    </g>

    <!-- Row 4: FontBase -->
    <g transform="translate(0, 266)">
      <text x="158" y="21" text-anchor="end" font-size="13" font-weight="500" fill="#B7A1D9">FontBase (Electron)</text>
      <rect x="172" y="6" width="170" height="22" rx="11" fill="#FFF9F2" fill-opacity="0.06"/>
      <rect x="172" y="6" width="98" height="22" rx="11" fill="url(#plumBar)">
        <animate attributeName="width" from="0" to="98" dur="1.0s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/>
      </rect>
      <text x="356" y="21" font-size="12.5" font-weight="700" fill="#F5EBDD">
        345.0 MB <tspan font-weight="500" fill="#9D8CA8">(9.0x)</tspan>
      </text>
    </g>

    <!-- Row 5: Adobe CC -->
    <g transform="translate(0, 326)">
      <text x="158" y="21" text-anchor="end" font-size="13" font-weight="500" fill="#B7A1D9">Adobe CC Desktop</text>
      <rect x="172" y="6" width="170" height="22" rx="11" fill="#FFF9F2" fill-opacity="0.06"/>
      <rect x="172" y="6" width="144" height="22" rx="11" fill="url(#plumBar)">
        <animate attributeName="width" from="0" to="144" dur="1.1s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/>
      </rect>
      <text x="356" y="21" font-size="12.5" font-weight="700" fill="#F5EBDD">
        620.0 MB <tspan font-weight="500" fill="#9D8CA8">(16.1x)</tspan>
      </text>
    </g>

    <!-- Row 6: Suitcase Fusion -->
    <g transform="translate(0, 386)">
      <text x="158" y="21" text-anchor="end" font-size="13" font-weight="500" fill="#B7A1D9">Suitcase Fusion</text>
      <rect x="172" y="6" width="170" height="22" rx="11" fill="#FFF9F2" fill-opacity="0.06"/>
      <rect x="172" y="6" width="170" height="22" rx="11" fill="url(#plumBar)">
        <animate attributeName="width" from="0" to="170" dur="1.2s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/>
      </rect>
      <text x="356" y="21" font-size="12.5" font-weight="700" fill="#F5EBDD">
        780.0 MB <tspan font-weight="500" fill="#9D8CA8">(20.3x)</tspan>
      </text>
    </g>

    <text x="26" y="454" font-size="10.5" fill="#9D8CA8" class="mono">
      * Compiled native Rust core + Adobe CC Port 27715 + System Health Inspector
    </text>
  </g>
</svg>
