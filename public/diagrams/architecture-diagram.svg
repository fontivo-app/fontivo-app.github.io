  <g transform="translate(48, 240)">
    <rect width="320" height="428" rx="16" fill="url(#glassCard)" stroke="#46324E" stroke-width="1.2"/>
    <rect x="0" y="0" width="320" height="42" rx="16" fill="#291C2E"/>
