      <rect x="12" y="12" width="4" height="40" rx="2" fill="#F16B50"/>
      <text x="26" y="28" font-size="12.5" font-weight="700" fill="#FFF9F2">System Health &amp; RAM Inspector</text>
      <text x="26" y="46" font-size="10.5" fill="#F5EBDD" fill-opacity="0.72">Live diagnostics, cache &amp; port checks</text>
