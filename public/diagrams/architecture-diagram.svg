      <text x="16" y="24" font-size="12" font-weight="600" fill="#FFF9F2">Bilingual Arabic &amp; Latin Preview</text>
      <text x="16" y="42" font-size="10.5" fill="#B7A1D9" class="mono">60 FPS Smooth Scrolling • 0 CPU Spikes</text>
    </g>
  </g>

