<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">Fontivo Core System Architecture</title>
  <desc id="archDesc">Clean architectural diagram of Fontivo v1.0.0: React 19 UI, Native Rust Core Engine (~38.5 MB idle RAM), Win32 AddFontResourceExW FR_PRIVATE, System Health Doctor, and Adobe CC Port 27715 synchronization.</desc>

  <defs>
    <radialGradient id="archBg" cx="50%" cy="35%" r="85%">
      <stop offset="0%" stop-color="#291C2E"/>
      <stop offset="65%" stop-color="#1D1322"/>
      <stop offset="100%" stop-color="#140D17"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFF9F2"/>
      <stop offset="70%" stop-color="#F5EBDD"/>
      <stop offset="100%" stop-color="#F16B50"/>
    </linearGradient>
    <linearGradient id="glassCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF9F2" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#B7A1D9" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="rustEngineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#291C2E"/>
      <stop offset="100%" stop-color="#1B1220"/>
    </linearGradient>
    <pattern id="archGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFF9F2" fill-opacity="0.04"/>
    </pattern>

    <!-- Crisp Arrow Markers (tip lands cleanly at line end) -->
    <marker id="arrowCoral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#F16B50"/>
    </marker>
    <marker id="arrowLavender" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#B7A1D9"/>
    </marker>
  </defs>

  <style>
  <![CDATA[
    @keyframes flowLaser {
      0% { stroke-dashoffset: 48; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes ringPulse1 {
      0%, 100% { stroke-opacity: 0.35; }
      12%, 25% { stroke-opacity: 1; }
    }
    @keyframes ringPulse2 {
      0%, 25%, 100% { stroke-opacity: 0.35; }
      37%, 50% { stroke-opacity: 1; }
    }
    @keyframes ringPulse3 {
      0%, 50%, 100% { stroke-opacity: 0.35; }
      62%, 75% { stroke-opacity: 1; }
    }
    @keyframes ringPulse4 {
      0%, 75%, 100% { stroke-opacity: 0.35; }
      87%, 98% { stroke-opacity: 1; }
    }
    @keyframes liveBeacon {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .flow-dash {
      stroke-dasharray: 6 10;
      animation: flowLaser 2.2s linear infinite;
    }
    .step-ring-1 { animation: ringPulse1 8s ease-in-out infinite; }
    .step-ring-2 { animation: ringPulse2 8s ease-in-out infinite; }
    .step-ring-3 { animation: ringPulse3 8s ease-in-out infinite; }
    .step-ring-4 { animation: ringPulse4 8s ease-in-out infinite; }
    .beacon { animation: liveBeacon 2.2s ease-in-out infinite; }

    text {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
    }
    .mono {
      font-family: 'JetBrains Mono', 'Segoe UI Mono', Consolas, monospace;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  ]]>
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="780" rx="24" fill="url(#archBg)"/>
  <rect width="1200" height="780" rx="24" fill="url(#archGrid)"/>
  <rect x="1" y="1" width="1198" height="778" rx="23" fill="none" stroke="#FFF9F2" stroke-opacity="0.1" stroke-width="1.5"/>

  <!-- HEADER -->
  <g transform="translate(48, 44)">
    <g transform="translate(0, -22) scale(0.072)">
      <path fill="#F16B50" d="M86 177c0-67 49-116 116-116h211c14 0 22 15 14 27l-43 66H204c-31 0-53 16-69 44l-49 85z"/>
      <path fill="#B7A1D9" d="M76 350c0-67 49-116 116-116h177c14 0 22 15 14 27l-43 66H194c-31 0-53 16-69 44l-49 85z"/>
    </g>

    <text x="48" y="4" font-size="26" font-weight="800" letter-spacing="-0.4" fill="url(#titleGrad)">
      Fontivo Core System Architecture
    </text>
    <text x="48" y="28" font-size="13.5" font-weight="400" fill="#F5EBDD" fill-opacity="0.78">
      Local-first zero-telemetry desktop architecture: React 19 UI  &#x2194;  Native Rust Core  &#x2194;  Win32 FR_PRIVATE &amp; Adobe CC :27715
    </text>

    <g transform="translate(916, -14)">
      <rect width="188" height="32" rx="16" fill="#291C2E" stroke="#B7A1D9" stroke-opacity="0.45" stroke-width="1.2"/>
      <circle cx="18" cy="16" r="4.5" fill="#F16B50" class="beacon"/>
      <text x="32" y="20.5" font-size="12" font-weight="700" fill="#FFF9F2">Localhost Active :3920</text>
    </g>
  </g>

  <!-- TOP PIPELINE: CLEAN SEGMENTED CONNECTORS (NEVER PASSING BEHIND CIRCLES) -->
  <g transform="translate(48, 102)">
    <rect width="1104" height="118" rx="16" fill="url(#glassCard)" stroke="#46324E" stroke-width="1.2"/>
    <text x="24" y="24" font-size="11" font-weight="700" letter-spacing="1.2" fill="#B7A1D9" class="mono">
      ZERO-LATENCY FONT ACTIVATION PIPELINE (10,939 FONTS / 4,430 FAMILIES)
    </text>

    <!-- 3 Segmented Connectors terminating cleanly outside each circle (r=22 + 4px gap) -->
    <g>
      <line x1="146" y1="62" x2="378" y2="62" stroke="#3D2B45" stroke-width="2.5"/>
      <line x1="146" y1="62" x2="378" y2="62" stroke="#F16B50" stroke-width="2" class="flow-dash" marker-end="url(#arrowCoral)"/>

      <line x1="434" y1="62" x2="666" y2="62" stroke="#3D2B45" stroke-width="2.5"/>
      <line x1="434" y1="62" x2="666" y2="62" stroke="#F16B50" stroke-width="2" class="flow-dash" marker-end="url(#arrowCoral)"/>

      <line x1="722" y1="62" x2="954" y2="62" stroke="#3D2B45" stroke-width="2.5"/>
      <line x1="722" y1="62" x2="954" y2="62" stroke="#B7A1D9" stroke-width="2" class="flow-dash" marker-end="url(#arrowLavender)"/>
    </g>

    <!-- Step 1: Discovery (opaque fill so nothing ever bleeds through) -->
    <g transform="translate(120, 62)">
      <circle cx="0" cy="0" r="22" fill="#291C2E" stroke="#F16B50" stroke-width="2" class="step-ring-1"/>
      <text x="0" y="5" text-anchor="middle" font-size="14" font-weight="800" fill="#FFF9F2" class="mono">1</text>
      <text x="0" y="40" text-anchor="middle" font-size="12" font-weight="700" fill="#FFF9F2">Discovery</text>
    </g>

    <!-- Step 2: Zero-Alloc Rust Parse -->
    <g transform="translate(408, 62)">
      <circle cx="0" cy="0" r="22" fill="#291C2E" stroke="#F16B50" stroke-width="2" class="step-ring-2"/>
      <text x="0" y="5" text-anchor="middle" font-size="14" font-weight="800" fill="#FFF9F2" class="mono">2</text>
      <text x="0" y="40" text-anchor="middle" font-size="12" font-weight="700" fill="#FFF9F2">Zero-Alloc Rust Parse</text>
    </g>

    <!-- Step 3: Win32 FR_PRIVATE -->
    <g transform="translate(696, 62)">
      <circle cx="0" cy="0" r="22" fill="#291C2E" stroke="#B7A1D9" stroke-width="2" class="step-ring-3"/>
      <text x="0" y="5" text-anchor="middle" font-size="14" font-weight="800" fill="#FFF9F2" class="mono">3</text>
      <text x="0" y="40" text-anchor="middle" font-size="12" font-weight="700" fill="#FFF9F2">AddFontResourceExW</text>
    </g>

    <!-- Step 4: Adobe CC Sync -->
    <g transform="translate(984, 62)">
      <circle cx="0" cy="0" r="22" fill="#291C2E" stroke="#B7A1D9" stroke-width="2" class="step-ring-4"/>
      <text x="0" y="5" text-anchor="middle" font-size="14" font-weight="800" fill="#FFF9F2" class="mono">4</text>
      <text x="0" y="40" text-anchor="middle" font-size="12" font-weight="700" fill="#B7A1D9">Adobe CC :27715</text>
    </g>
  </g>

  <!-- THREE ARCHITECTURAL PILLARS (COLUMNS: 320px wide, 72px gaps) -->

