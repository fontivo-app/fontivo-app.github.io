      <text x="26" y="46" font-size="10.5" fill="#F5EBDD" fill-opacity="0.72">High-contrast tokens, RTL/LTR optical calipers</text>
    </g>

    <g transform="translate(14, 204)">
      <rect width="292" height="64" rx="8" fill="#140D17" stroke="#3D2B45" stroke-width="1"/>
      <rect x="12" y="12" width="4" height="40" rx="2" fill="#B7A1D9"/>
      <text x="26" y="28" font-size="12.5" font-weight="700" fill="#FFF9F2">Color Studio (5x5 Loupe)</text>
