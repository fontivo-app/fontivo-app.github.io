          </text>
          <text x="860" y="34" text-anchor="end" font-size="13.5" font-weight="500" fill="#F5EBDD" fill-opacity="0.75">
            Contemporary Arabic Typography Engineered with Mathematical Grid Precision
          </text>
        </g>

        <g transform="translate(20, 206)" class="mono" font-size="10" font-weight="600" fill="#9D8CA8">
