        <rect width="236" height="34" rx="6" fill="transparent"/>
        <text x="16" y="21" font-size="12.5" font-weight="500" fill="#F5EBDD">All Fonts</text>
        <text x="222" y="21" text-anchor="end" font-size="11" font-weight="600" fill="#9D8CA8" class="mono">10,939</text>
      </g>

      <!-- Nav Item 2 (Active) -->
      <g transform="translate(12, 134)">
        <rect width="236" height="34" rx="6" fill="#291C2E" stroke="#F16B50" stroke-opacity="0.45" stroke-width="1"/>
        <rect x="0" y="4" width="3.5" height="26" rx="2" fill="#F16B50"/>
        <text x="16" y="21" font-size="12.5" font-weight="700" fill="#FFF9F2">Arabic Type Families</text>
        <text x="222" y="21" text-anchor="end" font-size="11" font-weight="700" fill="#F16B50" class="mono">4,430</text>
      </g>

      <!-- Nav Item 3 -->
      <g transform="translate(12, 174)">
        <rect width="236" height="34" rx="6" fill="transparent"/>
        <text x="16" y="21" font-size="12.5" font-weight="500" fill="#F5EBDD">Color Studio</text>
        <text x="222" y="21" text-anchor="end" font-size="10" font-weight="600" fill="#B7A1D9" class="mono">5x5 LOUPE</text>
      </g>

      <!-- Nav Item 4 -->
