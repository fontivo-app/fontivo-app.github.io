        <text x="16" y="21" font-size="12.5" font-weight="500" fill="#F5EBDD">System &amp; RAM Health</text>
        <text x="222" y="21" text-anchor="end" font-size="10.5" font-weight="700" fill="#F16B50" class="mono">OK</text>
      </g>

      <line x1="20" y1="304" x2="240" y2="304" stroke="#3D2B45" stroke-width="1"/>

      <!-- SYSTEM METRICS CARD -->
      <g transform="translate(14, 320)">
        <rect width="232" height="156" rx="10" fill="#140D17" stroke="#3D2B45" stroke-width="1"/>
        <text x="14" y="22" font-size="10" font-weight="700" letter-spacing="0.8" fill="#B7A1D9" class="mono">SYSTEM PERFORMANCE</text>

        <text x="14" y="48" font-size="11.5" fill="#9D8CA8">Indexed Catalog:</text>
        <text x="218" y="48" text-anchor="end" font-size="11.5" font-weight="700" fill="#FFF9F2" class="mono">10,939 / 4,430</text>

        <text x="14" y="72" font-size="11.5" fill="#9D8CA8">Idle Resident RAM:</text>
        <text x="218" y="72" text-anchor="end" font-size="11.5" font-weight="700" fill="#F16B50" class="mono">~38.5 MB</text>

        <text x="14" y="96" font-size="11.5" fill="#9D8CA8">Adobe CC Bridge:</text>
        <text x="218" y="96" text-anchor="end" font-size="11" font-weight="700" fill="#B7A1D9" class="mono">PORT 27715</text>

        <text x="14" y="120" font-size="11.5" fill="#9D8CA8">Win32 Isolation:</text>
        <text x="218" y="120" text-anchor="end" font-size="11" font-weight="700" fill="#FFF9F2" class="mono">FR_PRIVATE</text>

        <rect x="14" y="136" width="204" height="5" rx="2.5" fill="#291C2E"/>
        <rect x="14" y="136" width="188" height="5" rx="2.5" fill="url(#lavenderGrad)"/>
      </g>

      <!-- Foundry Note -->
      <g transform="translate(14, 492)">
        <rect width="232" height="92" rx="10" fill="#241628" stroke="#46324E" stroke-width="1"/>
        <text x="14" y="24" font-size="11" font-weight="800" fill="#FFF9F2">ZERO-REGISTRY ENGINE</text>
        <text x="14" y="44" font-size="10.5" fill="#F5EBDD" fill-opacity="0.8">Instant RAM font activation.</text>
        <text x="14" y="60" font-size="10.5" fill="#B7A1D9">No OS clutter. Clean on exit.</text>
        <text x="14" y="79" font-size="9.5" font-weight="600" fill="#F16B50" class="mono">AddFontResourceExW</text>
      </g>
    </g>

    <!-- RIGHT MAIN WORKSPACE CANVAS (Width: 956px) -->
    <g transform="translate(260, 54)">
      <rect width="956" height="610" fill="#140D17"/>

      <!-- Controls Toolbar (clean separation, zero overlapping text) -->
