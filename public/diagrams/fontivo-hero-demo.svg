              <text x="63" y="14" text-anchor="middle" font-size="10" font-weight="700" fill="#FFF9F2" class="mono">0ms ACTIVATED</text>
            </g>
          </g>
        </g>

        <line x1="20" y1="50" x2="888" y2="50" stroke="#3D2B45" stroke-width="1" stroke-dasharray="3 4"/>

        <g transform="translate(24, 132)">
