          <text x="132" y="17" text-anchor="middle" font-size="11" font-weight="500" fill="#B7A1D9">Arabic</text>

          <rect x="180" y="0" width="76" height="26" rx="6" fill="#1D1322" stroke="#3D2B45" stroke-width="1"/>
          <text x="218" y="17" text-anchor="middle" font-size="11" font-weight="500" fill="#B7A1D9">Latin</text>

          <rect x="264" y="0" width="88" height="26" rx="6" fill="#1D1322" stroke="#3D2B45" stroke-width="1"/>
          <text x="308" y="17" text-anchor="middle" font-size="11" font-weight="500" fill="#B7A1D9">Variable</text>
