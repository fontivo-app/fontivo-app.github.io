          <rect x="320" y="2" width="94" height="20" rx="4" fill="#140D17" stroke="#3D2B45" stroke-width="1"/>
          <text x="367" y="15.5" text-anchor="middle" font-size="10" font-weight="600" fill="#F5EBDD" class="mono">VAR 100-900</text>

          <rect x="422" y="2" width="98" height="20" rx="4" fill="#140D17" stroke="#3D2B45" stroke-width="1"/>
