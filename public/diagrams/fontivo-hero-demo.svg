      <rect width="260" height="610" fill="#1D1322"/>
      <line x1="260" y1="0" x2="260" y2="610" stroke="#3D2B45" stroke-width="1"/>

      <!-- Search Input -->
      <g transform="translate(16, 18)">
        <rect width="228" height="34" rx="8" fill="#140D17" stroke="#3D2B45" stroke-width="1"/>
        <circle cx="16" cy="17" r="4.5" fill="none" stroke="#9D8CA8" stroke-width="1.4"/>
        <line x1="20" y1="21" x2="23.5" y2="24.5" stroke="#9D8CA8" stroke-width="1.4" stroke-linecap="round"/>
        <text x="32" y="21" font-size="11.5" fill="#9D8CA8">Search 10,939 fonts...</text>
        <rect x="178" y="8" width="42" height="18" rx="4" fill="#291C2E" stroke="#46324E" stroke-width="1"/>
        <text x="199" y="20" text-anchor="middle" font-size="9.5" font-weight="600" fill="#B7A1D9" class="mono">Ctrl K</text>
      </g>

      <text x="20" y="82" font-size="10" font-weight="700" letter-spacing="1" fill="#9D8CA8" class="mono">LIBRARY COLLECTIONS</text>

      <!-- Nav Item 1 -->
