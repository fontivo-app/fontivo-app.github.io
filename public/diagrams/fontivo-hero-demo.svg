<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Fontivo Desktop Studio — Zero-Latency Font Management</title>
  <desc id="heroDesc">Clean vector demonstration of Fontivo v1.0.0: Win32 AddFontResourceExW FR_PRIVATE activation, Adobe CC Port 27715 synchronization, Color Studio 5x5 Loupe, and Arabic and Latin typography across 10,939 fonts and 4,430 families.</desc>

  <defs>
    <radialGradient id="studioBg" cx="50%" cy="40%" r="85%">
      <stop offset="0%" stop-color="#291C2E"/>
      <stop offset="65%" stop-color="#1D1322"/>
      <stop offset="100%" stop-color="#140D17"/>
    </radialGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#291C2E"/>
      <stop offset="100%" stop-color="#1D1322"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#24182B"/>
      <stop offset="100%" stop-color="#1A1120"/>
    </linearGradient>
    <linearGradient id="lavenderGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B7A1D9"/>
      <stop offset="100%" stop-color="#F16B50"/>
    </linearGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFF9F2" fill-opacity="0.04"/>
    </pattern>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="24" flood-color="#0A060C" flood-opacity="0.72"/>
    </filter>
  </defs>

  <style>
    <![CDATA[
    @keyframes pulseLiveDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    @keyframes toggleSlide {
      0%, 20% { transform: translateX(0px); fill: #9D8CA8; }
      30%, 85% { transform: translateX(22px); fill: #FFF9F2; }
      95%, 100% { transform: translateX(0px); fill: #9D8CA8; }
    }
    @keyframes toggleBg {
      0%, 20% { fill: #291C2E; stroke: #46324E; }
      30%, 85% { fill: #F16B50; stroke: #F16B50; }
      95%, 100% { fill: #291C2E; stroke: #46324E; }
    }
    @keyframes latencyReveal {
      0%, 22% { opacity: 0.35; }
      32%, 85% { opacity: 1; }
      95%, 100% { opacity: 0.35; }
    }

    .live-dot { animation: pulseLiveDot 2.4s ease-in-out infinite; }
    .toggle-knob { animation: toggleSlide 8s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .toggle-track { animation: toggleBg 8s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .latency-badge { animation: latencyReveal 8s ease-in-out infinite; }

    text {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Tajawal, Roboto, sans-serif;
    }
    .mono {
      font-family: 'JetBrains Mono', 'Segoe UI Mono', Consolas, monospace;
    }
    .arabic-text {
      font-family: 'Tajawal', 'Amiri', 'Segoe UI', sans-serif;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .toggle-knob { transform: translateX(22px); fill: #FFF9F2; }
      .toggle-track { fill: #F16B50; stroke: #F16B50; }
      .latency-badge { opacity: 1; }
    }
    ]]>
  </style>

  <!-- Canvas Backdrop -->
  <rect width="1280" height="720" fill="url(#studioBg)"/>
  <rect width="1280" height="720" fill="url(#dotGrid)"/>

  <!-- MAIN APPLICATION SHELL -->
  <g transform="translate(32, 28)" filter="url(#softShadow)">
    <rect width="1216" height="664" rx="16" fill="#140D17" stroke="#3D2B45" stroke-width="1.4"/>

    <!-- TITLEBAR -->
    <rect width="1216" height="54" rx="16" fill="url(#headerGrad)"/>
    <rect y="38" width="1216" height="16" fill="url(#headerGrad)"/>
    <line x1="0" y1="54" x2="1216" y2="54" stroke="#3D2B45" stroke-width="1"/>

    <!-- Window Controls -->
    <circle cx="28" cy="27" r="5.5" fill="#F16B50" fill-opacity="0.85"/>
    <circle cx="48" cy="27" r="5.5" fill="#B7A1D9" fill-opacity="0.6"/>
    <circle cx="68" cy="27" r="5.5" fill="#FFF9F2" fill-opacity="0.35"/>

    <!-- Brand Emblem & Title (clean spacing) -->
    <g transform="translate(96, 12)">
      <g transform="translate(0, 1) scale(0.052)">
        <path fill="#F16B50" d="M86 177c0-67 49-116 116-116h211c14 0 22 15 14 27l-43 66H204c-31 0-53 16-69 44l-49 85z"/>
        <path fill="#B7A1D9" d="M76 350c0-67 49-116 116-116h177c14 0 22 15 14 27l-43 66H194c-31 0-53 16-69 44l-49 85z"/>
      </g>
      <text x="34" y="21" font-size="15.5" font-weight="800" fill="#FFF9F2">Fontivo</text>
      <text x="102" y="21" font-size="13" font-weight="500" fill="#B7A1D9">Desktop Studio</text>
    </g>

    <!-- Header Status Pill -->
    <g transform="translate(344, 15)">
      <rect width="232" height="24" rx="12" fill="#1D1322" stroke="#46324E" stroke-width="1"/>
      <circle cx="15" cy="12" r="4" fill="#F16B50" class="live-dot"/>
      <text x="27" y="16" font-size="11" font-weight="700" fill="#FFF9F2">Win32 FR_PRIVATE: Active</text>
    </g>

    <!-- Header Adobe CC Port 27715 Badges -->
    <g transform="translate(838, 14)">
      <rect x="0" y="0" width="174" height="26" rx="6" fill="#1D1322" stroke="#B7A1D9" stroke-opacity="0.55" stroke-width="1"/>
      <rect x="6" y="4" width="18" height="18" rx="3" fill="#291C2E"/>
      <text x="15" y="17" text-anchor="middle" font-size="10.5" font-weight="800" fill="#B7A1D9" class="mono">Ps</text>
      <text x="32" y="17" font-size="11" font-weight="600" fill="#FFF9F2">Photoshop :27715</text>

      <g transform="translate(184, 0)">
        <rect x="0" y="0" width="174" height="26" rx="6" fill="#1D1322" stroke="#F16B50" stroke-opacity="0.55" stroke-width="1"/>
        <rect x="6" y="4" width="18" height="18" rx="3" fill="#291C2E"/>
        <text x="15" y="17" text-anchor="middle" font-size="10.5" font-weight="800" fill="#F16B50" class="mono">Ai</text>
        <text x="32" y="17" font-size="11" font-weight="600" fill="#FFF9F2">Illustrator :27715</text>
      </g>
    </g>

    <!-- LEFT SIDEBAR (Width: 260px) -->
