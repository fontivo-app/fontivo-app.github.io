          <rect x="200" y="2" width="106" height="20" rx="4" fill="#140D17" stroke="#3D2B45" stroke-width="1"/>
          <text x="253" y="15.5" text-anchor="middle" font-size="10" font-weight="600" fill="#B7A1D9" class="mono">ARABIC MODERN</text>

          <rect x="314" y="2" width="80" height="20" rx="4" fill="#140D17" stroke="#3D2B45" stroke-width="1"/>
          <text x="354" y="15.5" text-anchor="middle" font-size="10" font-weight="600" fill="#F5EBDD" class="mono">BOLD 700</text>

          <rect x="402" y="2" width="112" height="20" rx="4" fill="#140D17" stroke="#3D2B45" stroke-width="1"/>
          <text x="458" y="15.5" text-anchor="middle" font-size="10" font-weight="600" fill="#F16B50" class="mono">OT: LIGA + KERN</text>

          <g transform="translate(656, 0)">
