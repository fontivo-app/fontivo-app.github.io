          <text x="108" y="14">X-HEIGHT: 68PX</text>
          <text x="236" y="14">GLYPHS: 864</text>
          <text x="352" y="14">UNICODE 15.1</text>
          <text x="868" y="14" text-anchor="end" fill="#B7A1D9">ADOBE CC :27715 READY</text>
        </g>
      </g>

