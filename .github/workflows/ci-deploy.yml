name: Fontivo-Site CI & Static Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify code formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run unit & SEO tests
        run: npm test

      - name: Build static export
        env:
          NEXT_PUBLIC_BASE_PATH: /Fontivo-Site
          NEXT_PUBLIC_SITE_URL: https://ahmedfahmy8308.github.io/Fontivo-Site
        run: npm run build

      - name: Upload static site artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
